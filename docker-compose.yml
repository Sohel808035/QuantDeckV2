version: '3.8'

services:
  backend:
    build: .
    container_name: quantspherex-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_KEYS=prod-secret-key-1,prod-secret-key-2
    env_file:
      - .env
    volumes:
      - ./data_cache:/app/data_cache
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/health/status"]
      interval: 30s
      timeout: 10s
      retries: 3
