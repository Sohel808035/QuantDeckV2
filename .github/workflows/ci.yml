name: QuantSphereX CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Tests with Coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html tests/
          
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/
          
      - name: Codecov Upload
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          
  performance-check:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Pytest Benchmarks
        run: |
          pytest tests/performance/test_benchmarks.py --benchmark-only --benchmark-autosave
          
      - name: Run Locust Headless (Smoke Test)
        run: |
          # Starts a FastAPI server in the background and hits it with Locust for 10 seconds
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          locust -f tests/performance/locustfile.py --host=http://127.0.0.1:8000 --headless -u 10 -r 2 --run-time 10s
          
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: performance-check
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build Docker Image
        run: |
          docker build -t quantspherex-backend:latest .
        
      # Uncomment to enable push to registry
